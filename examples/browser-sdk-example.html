<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FairProof | Browser SDK Live Verification</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      padding: 32px 24px;
      background: #06080e;
      color: #f8fafc;
      font-family: 'Outfit', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      min-height: 100vh;
      box-sizing: border-box;
    }
    .container {
      max-width: 900px;
      margin: 0 auto;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      padding-bottom: 16px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      flex-wrap: wrap;
      gap: 16px;
    }
    h1 {
      font-size: 1.8rem;
      font-weight: 800;
      margin: 0;
      background: linear-gradient(135deg, #ffffff 40%, #818cf8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .badge {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.75rem;
      padding: 4px 10px;
      border-radius: 999px;
      background: rgba(16, 185, 129, 0.15);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.3);
    }
    p {
      color: #94a3b8;
      font-size: 0.95rem;
      line-height: 1.6;
      margin-bottom: 24px;
    }
    .actions {
      display: flex;
      gap: 12px;
      margin-bottom: 20px;
    }
    button {
      font-family: inherit;
      font-weight: 600;
      font-size: 0.88rem;
      padding: 10px 18px;
      border-radius: 8px;
      cursor: pointer;
      border: none;
      transition: all 0.2s ease;
    }
    .btn-run {
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      color: #fff;
    }
    .btn-run:hover {
      filter: brightness(1.1);
      transform: translateY(-1px);
    }
    .btn-nav {
      background: rgba(255, 255, 255, 0.06);
      color: #f8fafc;
      border: 1px solid rgba(255, 255, 255, 0.1);
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      padding: 10px 18px;
      border-radius: 8px;
      font-size: 0.88rem;
    }
    .btn-nav:hover {
      background: rgba(255, 255, 255, 0.1);
    }
    pre {
      min-height: 340px;
      overflow: auto;
      padding: 20px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      background: #0b0f19;
      color: #38bdf8;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.82rem;
      line-height: 1.6;
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.5);
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div>
        <h1>FairProof Standalone SDK Runner</h1>
      </div>
      <div class="badge">WebCrypto Native</div>
    </div>
    
    <p>This sandbox tests match creation, salted SHA-256 hand commitments, valid ZK proof generation, forged move attack rejection, and public receipt creation in pure browser memory.</p>

    <div class="actions">
      <button class="btn-run" onclick="runExample()">▶ Re-run Simulation</button>
      <a class="btn-nav" href="../demo.html">← Back to Cockpit</a>
    </div>

    <pre id="output">Running FairProof cryptographic verification...</pre>
  </div>

  <script src="../src/sdk/fairproof.js"></script>
  <script>
    async function runExample() {
      const outputEl = document.querySelector("#output");
      outputEl.textContent = "Computing SHA-256 salted commitments...";
      
      const deck = FairProof.shuffle(FairProof.createDeck());
      const playerHand = deck.slice(0, 5);
      const opponentHand = deck.slice(5, 10);
      const match = await FairProof.createMatch({ playerHand, opponentHand });

      const validProof = await FairProof.verifyMove({
        ruleset: match.ruleset,
        privateHand: match.player.privateHand,
        salt: match.player.salt,
        commitment: match.player.commitment,
        move: { card: playerHand[0] }
      });

      const forgedCard = deck.slice(10).find((card) => !playerHand.some((owned) => owned.id === card.id));
      const invalidProof = await FairProof.verifyMove({
        ruleset: match.ruleset,
        privateHand: match.player.privateHand,
        salt: match.player.salt,
        commitment: match.player.commitment,
        move: { card: forgedCard }
      });

      const receipt = await FairProof.createReceipt({
        proof: validProof,
        round: 1,
        matchId: match.id
      });

      outputEl.textContent = JSON.stringify({
        summary: "Zero-Knowledge Verification Execution Successful",
        matchId: match.id,
        ruleset: match.ruleset,
        playerCommitment: match.player.commitment,
        test1_ValidMoveResult: {
          playedCard: validProof.publicMove,
          verified: validProof.valid,
          proofHash: validProof.proofHash
        },
        test2_ForgedMoveAttackResult: {
          forgedCard: invalidProof.publicMove,
          verified: invalidProof.valid,
          proofHash: invalidProof.proofHash,
          reason: "Card was not part of original salted commitment root"
        },
        publicReceipt: receipt
      }, null, 2);
    }

    runExample();
  </script>
</body>
</html>
